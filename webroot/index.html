            --red:         #ff3860;

            --text-dim:    rgba(100, 160, 210, 0.5);
            --mono:        'Share Tech Mono', monospace;
            --head:        'Orbitron', sans-serif;

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }

        body {

            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,180,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,180,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }



        #dashboard {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 600px) { #dashboard { padding: 24px; } }

        .container {
            max-width: 560px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 8px;
            padding-bottom: 12px;
        }

        /* ---- Header ---- */
        .header {
            text-align: center;
            padding: 10px 0 4px;
            position: relative;
        }

        .version-badge {
            position: absolute;
            top: 10px;
            right: 0;
            font-family: var(--mono);
            font-size: 0.6rem;
            color: var(--cyan-dim);
            letter-spacing: 1.5px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 3px 8px;
            line-height: 1;
        }

        .version-badge::before {
            content: 'v';
            opacity: 0.5;
        }

        .header-title {
            font-family: var(--head);
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--cyan);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--cyan-dim), 0 0 40px rgba(0,180,255,0.2);
        }

        .header-sub {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* ---- Panel (generic bordered card) ---- */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        /* Corner accents */
        .panel::before, .panel::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: var(--cyan);
            border-style: solid;
        }
        .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        .panel-label {
            font-family: var(--head);
            font-size: 0.55rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--cyan-dim);
            padding: 8px 12px 0;
        }

        .panel-body { padding: 8px 12px 10px; }

        /* ---- Status Row ---- */
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 5px 12px;
            font-family: var(--head);
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--amber);
            box-shadow: 0 0 6px var(--amber), 0 0 12px var(--amber-dim);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.5; }
        }

        .driver-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.62rem;
            letter-spacing: 1px;
            color: var(--text-dim);
            border: 1px solid var(--border);
            background: var(--bg-card);
            border-radius: 3px;
            padding: 5px 10px;
        }
        .driver-tag.modular { border-color: var(--green-dim); color: var(--green); }
        .driver-tag.builtin { border-color: var(--amber-dim); color: var(--amber); }
        .driver-tag svg { width: 11px; height: 11px; }

        /* ---- Stats Grid ---- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .stat-cell {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 8px 6px;
            text-align: center;
            position: relative;
        }

        .stat-cell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cyan-dim), transparent);
        }

        .stat-lbl {
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cyan-dim);
            display: block;
        }

        .stat-val {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-bright);
            display: block;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---- Patch Info ---- */
        .patch-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .patch-glyph {
            font-size: 1.2rem;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }

        .patch-text { flex: 1; min-width: 0; }

        .patch-name {
            font-size: 0.8rem;
            color: var(--text-bright);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .patch-meta {
            font-size: 0.62rem;
            color: var(--text-dim);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---- Profile Buttons — single line, compact ---- */
        .profile-row {
            display: flex;
            gap: 6px;
        }

        .prof-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 8px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg-card);
            color: var(--text-dim);
            font-family: var(--head);
            font-size: 0.62rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
        }

        .prof-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

        .prof-btn .phint {
            font-family: var(--mono);
            font-size: 0.55rem;
            opacity: 0.6;
            letter-spacing: 0;
            text-transform: none;
            margin-left: 2px;
        }

        .prof-btn:active { transform: scale(0.97); }
        .prof-btn:disabled { opacity: 0.3; pointer-events: none; }

        .prof-btn.perf  { border-color: var(--green-dim);  color: var(--green); }
        .prof-btn.perf.active  {
            background: var(--green-glow);
            border-color: var(--green);
            box-shadow: 0 0 12px var(--green-glow), inset 0 0 8px var(--green-glow);
        }

        .prof-btn.bal   { border-color: var(--amber-dim);  color: var(--amber); }
        .prof-btn.bal.active {
            background: var(--amber-glow);
            border-color: var(--amber);
            box-shadow: 0 0 12px var(--amber-glow), inset 0 0 8px var(--amber-glow);
        }

        .prof-btn.stock { border-color: var(--border); color: var(--text-dim); }
        .prof-btn.stock.active {
            background: rgba(180,220,255,0.05);
            border-color: var(--text-dim);
            color: var(--text);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .prof-btn.processing,
        .util-btn.processing {
            color: transparent !important;
            pointer-events: none;
        }
        .prof-btn.processing svg,
        .util-btn.processing svg { visibility: hidden; }
        .prof-btn.processing::after,
        .util-btn.processing::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            margin: -7px 0 0 -7px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* ---- Utility Buttons ---- */
        .util-row { display: flex; gap: 6px; }

        .util-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 6px;
            border: 1px solid var(--border);
            border-radius: 3px;
            background: var(--bg-card);
            color: var(--text-dim);
            font-family: var(--head);
            font-size: 0.58rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .util-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
        .util-btn:active { transform: scale(0.97); }

        .util-btn.danger  { border-color: rgba(255,56,96,0.4);  color: var(--red); }
        .util-btn.danger:hover  { background: var(--red-glow); }
        .util-btn.warn    { border-color: var(--amber-dim); color: var(--amber); }
        .util-btn:not(.danger):not(.warn):hover { border-color: var(--cyan-dim); color: var(--cyan); }

        /* ---- Reboot Banner ---- */
        #reboot-banner {
            display: none;
            background: var(--amber-glow);
            border: 1px solid var(--amber-dim);
            border-radius: 4px;
            padding: 10px 12px;
            gap: 10px;
            align-items: flex-start;
            animation: fadeIn 0.3s ease;
        }
        #reboot-banner.visible { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

        .banner-icon { font-size: 1.1rem; flex-shrink: 0; }
        .banner-body { flex: 1; }
        .banner-title { font-family: var(--head); font-size: 0.7rem; letter-spacing: 2px; color: var(--amber); margin-bottom: 4px; }
        .banner-desc  { font-size: 0.68rem; color: var(--text); line-height: 1.5; }

        .banner-btn {
            margin-top: 8px;
            padding: 6px 12px;
            border: 1px solid var(--amber);
            border-radius: 3px;
            background: transparent;
            color: var(--amber);
            font-family: var(--head);
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        /* ---- Log ---- */
        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px 0;
        }

        .log-clear {
            font-family: var(--head);
            font-size: 0.5rem;
            letter-spacing: 2px;
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 3px;
            padding: 2px 7px;
            cursor: pointer;
        }
        .log-clear:hover { border-color: var(--red); color: var(--red); }

        #console-output {
            padding: 8px 12px 10px;
            font-family: var(--mono);
            font-size: 0.7rem;
            line-height: 1.7;
            overflow-y: auto;
            max-height: 60vh;
            transition: max-height 0.3s ease;
        }

        #console-output.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        #console-output::-webkit-scrollbar { width: 3px; }
        #console-output::-webkit-scrollbar-track { background: transparent; }
        #console-output::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

        .log-line    { display: block; }
        .log-ts      { color: var(--text-dim); margin-right: 6px; }
        .log-info    { color: var(--cyan); }
        .log-success { color: var(--green); }
        .log-warning { color: var(--amber); }
        .log-error   { color: var(--red); }
        .log-builtin { color: var(--purple); }
        .log-system  { color: var(--text-dim); }

        /* Scanning line animation on log panel */
        .panel.log-panel {
            display: flex;
            flex-direction: column;
        }

        .panel.log-panel::before {
            animation: scanline 4s linear infinite;
        }
        @keyframes scanline {
            0%   { top: -1px; }
            100% { top: calc(100% + 1px); }
        }

        @media (max-width: 380px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .header-title { font-size: 1rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
<div id="dashboard">
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="header-title">WI-FI TUNER</div>
      <div class="header-sub">Qualcomm Config Switcher // KernelSU</div>
      <span class="version-badge" id="version-badge">—</span>
    </div>

    <!-- Status -->
    <div class="panel">
      <div class="panel-label">System Status</div>
      <div class="panel-body">
        <div class="status-row">
          <div class="status-badge">
            <span id="status-dot" class="status-dot"></span>
            <span id="current-mode">READY</span>
          </div>
          <div id="driver-pill" class="driver-tag unknown">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 15H6l7-14v8h5l-7 14v-8z"/></svg>
            <span id="driver-label">SCANNING…</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="panel">
      <div class="panel-label">Link Telemetry</div>
      <div class="panel-body">
        <div class="stats-grid">
          <div class="stat-cell"><span class="stat-lbl">Signal</span><span id="stat-rssi"  class="stat-val">--</span></div>
          <div class="stat-cell"><span class="stat-lbl">Speed</span> <span id="stat-speed" class="stat-val">--</span></div>
          <div class="stat-cell"><span class="stat-lbl">Freq</span>  <span id="stat-freq"  class="stat-val">--</span></div>
          <div class="stat-cell"><span class="stat-lbl">SSID</span>  <span id="stat-ssid"  class="stat-val">--</span></div>
        </div>
      </div>
    </div>

    <!-- Patch Profile -->
    <div class="panel">
      <div class="panel-label">Patch Profile</div>
      <div class="panel-body">
        <div class="patch-row">
          <div class="patch-glyph" id="patch-icon">⬡</div>
          <div class="patch-text">
            <div class="patch-name" id="patch-name">DETECTING…</div>
            <div class="patch-meta" id="patch-meta">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Reboot Banner -->
    <div id="reboot-banner">
      <div class="banner-icon">⚠</div>
      <div class="banner-body">
        <div class="banner-title">Reboot Required</div>
        <div class="banner-desc" id="reboot-banner-desc">Built-in driver detected. Config written — reboot to apply.</div>
        <button class="banner-btn" onclick="app.requestReboot()">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4C7.58 4 4 7.58 4 12s3.58 8 8 8 8-3.58 8-8h-2c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L11 13h7V6l-2.35.35z"/></svg>
          Reboot Now
        </button>
      </div>
    </div>

    <!-- Profile Buttons -->
    <div class="panel">
      <div class="panel-label">Performance Profile</div>
      <div class="panel-body">
        <div class="profile-row">
          <button class="prof-btn perf" id="btn-perf" onclick="app.applyMode('perf')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13,10h7l-9,11v-7H4l9-11V10z"/></svg>
            Perf
            <span class="phint" id="hint-perf"></span>
          </button>
          <button class="prof-btn bal" id="btn-bal" onclick="app.applyMode('balanced')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"/></svg>
            Balanced
            <span class="phint" id="hint-balanced"></span>
          </button>
          <button class="prof-btn stock" id="btn-stock" onclick="app.applyMode('stock')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13,3H6V21H18V8L13,3M13,9V4.5L17.5,9H13Z"/></svg>
            Stock
          </button>
        </div>
      </div>
    </div>

    <!-- Utilities -->
    <div class="panel">
      <div class="panel-label">Utilities</div>
      <div class="panel-body">
        <div class="util-row">
          <button id="reset-btn" class="util-btn danger" onclick="app.softReset()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12,5V1L7,6L12,11V7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12H5A7,7 0 0,0 12,19A7,7 0 0,0 19,12A7,7 0 0,0 12,5Z"/></svg>
            Reload
          </button>
          <button class="util-btn" onclick="app.showDriverInfo()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z"/></svg>
            Driver
          </button>
          <button class="util-btn" onclick="app.runDebug()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 8h-2.81c-.45-.78-1.07-1.45-1.82-1.96L17 4.41 15.59 3l-2.17 2.17C12.96 5.06 12.49 5 12 5s-.96.06-1.41.17L8.41 3 7 4.41l1.62 1.63C7.88 6.55 7.26 7.22 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81c1.04 1.79 2.97 3 5.19 3s4.15-1.21 5.19-3H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/></svg>
            Debug
          </button>
        </div>
      </div>
    </div>

    <!-- Log -->
    <div class="panel log-panel">
      <div class="log-header">
        <div class="panel-label" style="padding:0">System Log</div>
        <button class="log-clear" onclick="app.clearLog()">CLR</button>
      </div>
      <div id="console-output"></div>
    </div>

  </div>
</div>

<script type="module">

class KsuBridge {
    constructor() {
        this.hasKsu = !!(window.ksu && window.ksu.exec);
        this.actionScript = '/data/adb/modules/wifi_config_switcher/backend.sh';
    }
    async exec(cmd) {
        if (!this.hasKsu) { console.log('Mock:', cmd); return '{"status":"error","message":"KSU not detected"}'; }
        try {
            const r = await window.ksu.exec(cmd);
            if (typeof r === 'object' && r.errno !== undefined)
                return r.errno === 0 ? r.stdout : `{"status":"error","message":"errno ${r.errno}: ${r.stderr}"}`;
            return r || '';
        } catch(e) { return `{"status":"error","message":"${e.message}"}`; }
    }
    async runAction(action, arg) {
        const safe = arg !== undefined ? String(arg).replace(/'/g,"'\\''") : '';
        const cmd  = arg !== undefined
            ? `sh '${this.actionScript}' '${action}' '${safe}'`
            : `sh '${this.actionScript}' '${action}'`;
        return this.exec(cmd);
    }
}

function parseJson(raw) {
    if (!raw) return null;
    const s = raw.indexOf('{'), e = raw.lastIndexOf('}');
    if (s < 0 || e < 0) return null;
    try { return JSON.parse(raw.substring(s, e+1)); } catch { return null; }
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function patchLabel(src) {
    if (!src || src === 'none')          return { icon:'⬡', name:'NO PATCH FOUND',    meta:'' };
    if (src.startsWith('device-alias:')) return { icon:'◈', name:src.replace('device-alias:','ALIAS // ').toUpperCase(), meta:'hardware alias matched' };
    if (src.startsWith('device:'))       return { icon:'◈', name:src.replace('device:','DEVICE // ').toUpperCase(), meta:'device-specific profile' };
    if (src.startsWith('soc:'))          return { icon:'◇', name:src.replace('soc:','SOC // ').toUpperCase(), meta:'soc family profile' };
    if (src === 'generic_qcom')          return { icon:'△', name:'GENERIC // QCOM', meta:'fallback profile — contribute a device patch!' };
    return { icon:'◈', name:src.toUpperCase(), meta:'' };
}

class App {
    constructor() {
        this.ksu = new KsuBridge();
        this.processing = false;
        this.driverType = 'unknown';
        this.driverName = 'unknown';
        this.$log    = document.getElementById('console-output');
        this.$reset  = document.getElementById('reset-btn');
        this.$banner = document.getElementById('reboot-banner');
        this.init();
    }

    async init() {
        this.log('SYSTEM INIT…', 'system');
        this.loadVersion();
        await Promise.all([this.detectDriver(), this.loadPatchInfo(), this.checkMode()]);
        this.fetchStats();
        setInterval(() => this.fetchStats(), 5000);
    }

    loadVersion() {
        // Read version from module.prop via backend action
        this.ksu.runAction('get_version').then(raw => {
            const r = parseJson(raw);
            const el = document.getElementById('version-badge');
            if (r && r.version && el) {
                // Strip leading 'v' since ::before adds it
                el.textContent = r.version.replace(/^v/i, '');
            }
        });
    }

    // Driver
    async detectDriver() {
        const r = parseJson(await this.ksu.runAction('get_driver_type'));
        this.driverType = r?.driver_type || 'unknown';
        this.driverName = r?.driver_name || 'unknown';
        this.updateDriverTag();
        if (this.driverType === 'modular')
            this.log(`[DRV] MODULAR · ${this.driverName} — live reload supported`, 'success');
        else if (this.driverType === 'builtin')
            this.log(`[DRV] BUILT-IN · ${this.driverName} — reboot required`, 'builtin');
        else
            this.log('[DRV] TYPE UNKNOWN — detection inconclusive', 'warning');
    }

    updateDriverTag() {
        const tag   = document.getElementById('driver-pill');
        const label = document.getElementById('driver-label');
        tag.className = `driver-tag ${this.driverType}`;
        if      (this.driverType === 'modular') label.textContent = `MODULAR · ${this.driverName}`;
        else if (this.driverType === 'builtin') label.textContent = `BUILT-IN · ${this.driverName}`;
        else                                    label.textContent = 'UNKNOWN';
    }

    async showDriverInfo() {
        this.log('[DRV] QUERYING DETECTION EVIDENCE…', 'info');
        const r = parseJson(await this.ksu.runAction('get_driver_info'));
        if (!r) { this.log('[DRV] NO RESPONSE', 'error'); return; }
        this.log(`[DRV] name          : ${r.driver_name}`,          'info');
        this.log(`[DRV] type          : ${r.driver_type}`,          'info');
        this.log(`[DRV] kconf WLAN    : ${r.kconf_wlan}`,           'info');
        this.log(`[DRV] kconf driver  : ${r.kconf_driver}`,         'info');
        this.log(`[DRV] sys/mod sects : ${r.sys_module_sections}`,  'info');
        this.log(`[DRV] proc/modules  : ${r.proc_modules_entry}`,   'info');
        this.log(`[DRV] /module link  : ${r.module_symlink}`,       'info');
        this.log(`[DRV] subsystem     : ${r.subsystem}`,            'info');
        this.log(`[DRV] lsmod empty   : ${r.lsmod_empty}`,          'info');
    }

    // Patch
    async loadPatchInfo() {
        const r = parseJson(await this.ksu.runAction('get_patch_info'));
        if (!r) { document.getElementById('patch-name').textContent = 'LOAD FAILED'; return; }
        const lbl = patchLabel(r.patch_source || 'none');
        document.getElementById('patch-icon').textContent = lbl.icon;
        document.getElementById('patch-name').textContent = lbl.name;
        const parts = [];
        if (r.device && r.device !== 'unknown') parts.push(`dev:${r.device}`);
        if (r.soc    && r.soc    !== 'unknown') parts.push(`soc:${r.soc}`);
        if (lbl.meta) parts.push(lbl.meta);
        document.getElementById('patch-meta').textContent = parts.join(' · ') || '—';
        if (r.perf_params)     document.getElementById('hint-perf').textContent     = `[${r.perf_params}p]`;
        if (r.balanced_params) document.getElementById('hint-balanced').textContent = `[${r.balanced_params}p]`;
        this.log(`[PATCH] ${r.patch_source || 'none'} · perf=${r.perf_params ?? '?'}p bal=${r.balanced_params ?? '?'}p`, 'info');
        if (r.patch_source === 'generic_qcom')
            this.log(`[PATCH] ⚠ GENERIC FALLBACK — contribute a device patch!`, 'warning');
    }

    // Mode
    async checkMode() {
        const r = parseJson(await this.ksu.runAction('get_mode'));
        this.updateUIState(r?.mode || 'stock');
    }

    updateUIState(mode) {
        const dot   = document.getElementById('status-dot');
        const label = document.getElementById('current-mode');
        ['btn-perf','btn-bal','btn-stock'].forEach(id => document.getElementById(id)?.classList.remove('active'));
        if (mode === 'perf') {
            label.textContent = 'PERFORMANCE';
            dot.style.cssText = 'background:var(--green);box-shadow:0 0 6px var(--green),0 0 12px var(--green-dim)';
            document.getElementById('btn-perf')?.classList.add('active');
        } else if (mode === 'balanced') {
            label.textContent = 'BALANCED';
            dot.style.cssText = 'background:var(--amber);box-shadow:0 0 6px var(--amber),0 0 12px var(--amber-dim)';
            document.getElementById('btn-bal')?.classList.add('active');
        } else {
            label.textContent = 'STOCK';
            dot.style.cssText = 'background:var(--text-dim);box-shadow:none';
            document.getElementById('btn-stock')?.classList.add('active');
        }
    }

    // Apply
    async applyMode(mode) {
        if (this.processing) return;
        this.processing = true;
        const btnId = { perf:'btn-perf', balanced:'btn-bal', stock:'btn-stock' }[mode];
        document.querySelectorAll('.prof-btn').forEach(b => b.disabled = true);
        document.getElementById(btnId)?.classList.add('processing');
        document.getElementById('current-mode').textContent = 'APPLYING…';
        this.log(`APPLYING MODE: ${mode.toUpperCase()}`, 'info');

        try {
            const r = parseJson(await this.ksu.runAction('apply_mode', mode));
            if (!r) { this.log('PARSE ERROR — no response', 'error'); await this.checkMode(); return; }
            if (r.status === 'success') {
                this.log(`[CFG] ${r.message} (${r.params_applied ?? '?'} params)`, 'success');
                this.updateUIState(mode);
                if (r.driver_type) { this.driverType = r.driver_type; this.driverName = r.driver_name || this.driverName; this.updateDriverTag(); }
                if      (this.driverType === 'modular') { this.log('[DRV] MODULAR — triggering reload…', 'info'); setTimeout(() => this.softReset(true), 400); }
                else if (this.driverType === 'builtin') { this.log('[DRV] BUILT-IN — reboot required', 'builtin'); this.showRebootBanner(); }
                else                                    { this.log('[DRV] UNKNOWN — skipping reload', 'warning'); }
            } else {
                this.log(`ERROR: ${r.message || 'unknown'}`, 'error');
                await this.checkMode();
            }
        } catch(e) {
            this.log(`EXCEPTION: ${e.message}`, 'error');
            await this.checkMode();
        } finally {
            this.processing = false;
            document.querySelectorAll('.prof-btn').forEach(b => { b.disabled = false; b.classList.remove('processing'); });
        }
    }

    // Stats
    async fetchStats() {
        const d = parseJson(await this.ksu.runAction('stats'));
        if (!d) return;
        document.getElementById('stat-rssi').textContent  = d.rssi  || '--';
        document.getElementById('stat-speed').textContent = d.speed || '--';
        document.getElementById('stat-freq').textContent  = d.freq  || '--';
        document.getElementById('stat-ssid').textContent  = d.ssid  || '--';
    }

    // Reset
    async softReset(silent = false) {
        if (!silent) {
            if (this.driverType === 'builtin') { this.log('[DRV] BUILT-IN — cannot reload', 'builtin'); this.showRebootBanner(); return; }
            this.log('[DRV] RELOADING DRIVER…', 'info');
        }
        this.$reset.classList.add('processing');
        try {
            const r = parseJson(await this.ksu.runAction('soft_reset'));
            if (!r) { this.log('PARSE ERROR', 'error'); return; }
            if      (r.status === 'success') this.log(`[DRV] ${r.message}`, 'success');
            else if (r.status === 'builtin') { this.log(`[DRV] ${r.message}`, 'builtin'); this.showRebootBanner(r.driver_name); }
            else if (r.status === 'warning') this.log(`[DRV] WARN: ${r.message}`, 'warning');
            else                             this.log(`[DRV] ERR: ${r.message}`, 'error');
        } catch(e) { this.log(`EXCEPTION: ${e.message}`, 'error'); }
        finally     { this.$reset.classList.remove('processing'); }
    }

    // Banner
    showRebootBanner(name) {
        const n = name || this.driverName || 'built-in';
        document.getElementById('reboot-banner-desc').textContent =
            `Driver (${n}) is kernel-compiled. Config written — full reboot required.`;
        this.$banner.classList.add('visible');
    }

    requestReboot() {
        this.log('[SYS] REBOOT REQUESTED…', 'warning');
        this.ksu.exec('reboot')
            .then(() => this.log('[SYS] REBOOT CMD SENT', 'warning'))
            .catch(() => this.log('[SYS] REBOOT FAILED — reboot manually', 'error'));
    }

    // Log
    log(msg, type = 'info') {
        const now = new Date();
        const ts  = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
        const el  = document.createElement('span');
        el.className = 'log-line';
        el.innerHTML = `<span class="log-ts">[${ts}]</span><span class="log-${type}">${escHtml(msg)}</span>`;
        this.$log.appendChild(el);
        // Scroll to bottom only when already near the bottom (user may be reading)
        const nearBottom = this.$log.scrollHeight - this.$log.scrollTop - this.$log.clientHeight < 40;
        if (nearBottom) this.$log.scrollTop = this.$log.scrollHeight;
    }

    clearLog() {
        this.$log.innerHTML = '';
        this.log('LOG CLEARED', 'system');
    }

    async runDebug() {
        this.log('--- DEBUG DUMP ---', 'system');
        const raw = await this.ksu.exec(`sh '${this.ksu.actionScript}' 'get_debug_info'`);
        if (!raw) { this.log('NO OUTPUT', 'error'); return; }
        raw.split('\n').forEach(line => {
            if (!line.trim()) return;
            const t = line.startsWith('===') ? 'system' : line.includes('FOUND') ? 'success' : line.includes('absent') || line.includes('not') ? 'warning' : 'info';
            this.log(line, t);
        });
    }
}

window.app = new App();
</script>
</body>
